services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartilha-react-app:latest
    container_name: cartilha-react-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - cartilha_db:/app/server/data.db
      - cartilha_uploads:/app/server/uploads

volumes:
  cartilha_db:
  cartilha_uploads:
