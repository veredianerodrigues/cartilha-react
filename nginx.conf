server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Arquivos com hash no nome (gerados pelo Vite): cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML e service worker sempre revalidados, para publicar versões novas.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA: qualquer rota (ex.: /secao/menstruacao) devolve o index.html.
  location / {
    try_files $uri /index.html;
  }
}
